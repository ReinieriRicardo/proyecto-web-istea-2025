<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Tienda Artemis</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Send+Flowers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="images/logo.png">
</head>

<body>
    <header>
        <div class="brand">
            <a href="index.html"><img src="images/logo.png" alt="Logo Tienda Artemis" class="logo"></a>
            <a href="index.html">
                <h1>Artemis</h1>
            </a>
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-icon">☰</label>
        <nav>
            <form class="search-bar">
                <input type="text" placeholder="Buscar productos" aria-label="Buscar">
                <button type="submit">🔍</button>
            </form>
            
            <ul class="nav-categories">
                <li><a href="index.html" class="nav-link-todos">Todos</a></li>
                <li><a href="index.html?categoria=1" class="nav-link-categoria" data-categoria="1">Carteras</a></li>
                <li><a href="index.html?categoria=2" class="nav-link-categoria" data-categoria="2">Ropa</a></li>
                <li><a href="index.html?categoria=3" class="nav-link-categoria" data-categoria="3">Accesorios</a></li>
                <li><a href="cuenta.html" class="nav-link-cuenta">Cuenta <img src="images/icons/user.png" alt="icono usuario"></a></li>
                <li><a href="carrito.html" class="nav-link-carrito">Carrito <img src="images/icons/shopping-bag.png" alt="icono carrito">
                        (0)</a></li>
            </ul>
            </nav>
    </header>

    <main class="cart-page">
        <div class="cart-header">
            <h2>Carrito (0 productos)</h2> 
            <a href="index.html" class="seguir-comprando">Seguir comprando</a>
        </div>

        <div class="cart-layout">
            
            <section class="cart-items">
                </section>

            <aside class="cart-summary">
                <h3>Resumen de compra</h3>
                <p>Subtotal: <strong>$0</strong></p>
                <p>Envío: <span style="color:green">Gratis</span></p>
                <p>Total: <strong>$0</strong></p>
                <button class="btn btn-primary">Finalizar compra</button>

                <div class="cart-benefits">
                    <p>💳 Pagá en cuotas sin interés con tarjeta de crédito.</p>
                </div>
            </aside>
        </div>
    </main>


    <footer>
        <div class="footer-content">
            </div>

        <div class="footer-bottom">
            <p>&copy; 2025 Tienda Artemis - Todos los derechos reservados</p>
        </div>
    </footer>
    
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script src="carrito.js"></script>
</body>

</html>
