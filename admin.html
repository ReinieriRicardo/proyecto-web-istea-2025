<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tienda Artemis</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body class="admin-page">

    <h1>Panel de Administración</h1>

    <div class="admin-container">

        <section class="admin-form">
            <h2>Formulario de Producto</h2>
            <form id="form-producto">
                <input type="hidden" id="record_id">

                <div>
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo" required>
                </div>
                <div>
                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" name="precio" step="0.01" required>
                </div>
                <div>
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" name="descripcion" rows="4"></textarea>
                </div>
                <div>
                    <label for="caracteristicas">Características:</label>
                    <textarea id="caracteristicas" name="caracteristicas" rows="4"></textarea>
                </div>
                <div>
                    <label for="imagen">URL de la Imagen:</label>
                    <input type="text" id="imagen" name="imagen">
                </div>

                <button typebutton="submit" id="btn-guardar" class="btn btn-guardar">Agregar Producto</button>
                <button type="button" id="btn-nuevo" class="btn btn-nuevo">Limpiar Formulario</button>
            </form>
        </section>

        <section class="admin-table-container">
            <h2>Productos Existentes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos">
                    <tr>
                        <td colspan="3" style="text-align: center;">Cargando productos...</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
